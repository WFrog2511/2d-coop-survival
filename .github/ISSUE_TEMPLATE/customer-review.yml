name: 顧客レビュー
description: 顧客またはプロジェクトオーナーの確認・回答・承認が必要な事項を起票する。
title: "review: "
labels: ["type:customer-review"]
body:
  - type: textarea
    id: review_item
    attributes:
      label: 確認してほしいこと
      description: 一つのIssueには一つの確認事項を書く。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景と判断が必要な理由
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 選択肢と推奨案
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 回答期限と未回答時の影響
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・仕様・資料
      placeholder: "#123、docs/20_requirements/..."
    validations:
      required: true
