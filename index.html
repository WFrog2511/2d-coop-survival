<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メカサバイバル combat-choice-v1</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>メカサバイバル</h1>
        <p>
          移動: WASD / 矢印　武器: 1 ライフル / 2 ショットガン　照準: マウス移動　射撃: マウス左ボタン　リロード: R
        </p>
        <p data-testid="hud">
          武器: <output data-testid="weapon">アサルトライフル</output>
          残弾: <output data-testid="ammo">20/20</output>
          リロード: <output data-testid="reload">待機</output>
          プレイヤーHP: <output data-testid="hp">100</output>
          基本敵 #1 HP: <output data-testid="basic-1-hp">6</output>
          基本敵 #2 HP: <output data-testid="basic-2-hp">6</output>
          基本敵 #3 HP: <output data-testid="basic-3-hp">6</output>
          高速ドローン HP: <output data-testid="drone-hp">4</output>
          FPS: <output data-testid="fps">0</output>
        </p>
        <p data-testid="affinity">高速ドローン耐性: 小口径弾 50% / 散弾 100%</p>
        <p data-testid="feedback" aria-live="polite">-</p>
      </header>
      <div id="game" aria-label="戦闘アリーナ"></div>
      <section data-testid="defeat" hidden aria-live="assertive">
        <h2>敗北</h2>
        <p>機械群との接触でHPが0になりました。</p>
        <button data-testid="retry" type="button">再挑戦</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
